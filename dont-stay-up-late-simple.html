<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> ຢ່ານອນເດິກຫລາຍຍຍ </title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #1b1a3a;
    --bg-plum: #362a55;
    --bg-vignette: #100f24;
    --text-cream: #fff6e0;
    --accent-pink: #ffb5c9;
    --star-gold: #ffe9a8;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-plum) 0%, var(--bg-deep) 55%, var(--bg-vignette) 100%);
  }

  #stars{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    background: var(--star-gold);
    border-radius:50%;
    opacity:0.8;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:0.15; transform:scale(0.8); }
    50%{ opacity:1; transform:scale(1.15); }
  }

  h1{
    position:relative;
    z-index:1;
    font-family:'Mali', cursive;
    font-weight:700;
    font-size: clamp(2.4rem, 10vw, 6rem);
    text-align:center;
    color: var(--text-cream);
    text-shadow: 0 0 40px rgba(255,181,201,0.5);
    margin: 0;
    padding: 0 20px;
    animation: glow 3.2s ease-in-out infinite;
  }

  @keyframes glow{
    0%, 100%{ text-shadow: 0 0 30px rgba(255,181,201,0.35); }
    50%{ text-shadow: 0 0 55px rgba(255,181,201,0.65); }
  }

  @media (prefers-reduced-motion: reduce){
    .star, h1{ animation: none !important; }
  }
</style>
</head>
<body>

  <div id="stars"></div>
  <h1>อย่านอนดึกนะ 🌙</h1>

<script>
  const starField = document.getElementById('stars');
  const STAR_COUNT = 60;
  for(let i=0; i<STAR_COUNT; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2.4 + 1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.top = Math.random()*100 + '%';
    s.style.left = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.animationDuration = (2+Math.random()*2.5)+'s';
    starField.appendChild(s);
  }
</script>

</body>
</html>
